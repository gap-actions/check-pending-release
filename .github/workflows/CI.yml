---
name: CI

# Trigger the workflow on push to main, or on pull request
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: unreleased-changes
            expected: 'true'
            expected-quiet: '0'
            expected-commits: '1'
          - scenario: old-unreleased-changes
            expected: 'true'
            # the later CI change must reset neither the clock nor the count
            expected-quiet: '10'
            expected-commits: '1'
          - scenario: resumed-work
            expected: 'true'
            # work in progress resets the clock to its most recent commit
            expected-quiet: '2'
            expected-commits: '2'
          - scenario: ignored-changes-only
            expected: 'false'
            expected-quiet: '0'
            expected-commits: '0'
          - scenario: no-tags
            expected: 'true'
            expected-quiet: '30'
            expected-commits: '0'
          - scenario: nothing-since-tag
            expected: 'false'
            expected-quiet: '0'
            expected-commits: '0'

    steps:
      - uses: actions/checkout@v7
        with:
          path: this-action/

      # The action inspects the repository it is run in, so each scenario is a
      # throwaway repository created in the workspace root.
      - name: "Create test repository"
        run: |
          git init -q -b main .
          git config user.name "Test"
          git config user.email "test@example.com"

          # Backdate the initial commit, so that scenarios can check the
          # reported age of unreleased changes.
          export GIT_AUTHOR_DATE="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"

          mkdir -p src .github/workflows
          echo "1" > src/foo.c
          git add src/foo.c
          git commit -q -m "Initial commit"
          unset GIT_AUTHOR_DATE GIT_COMMITTER_DATE

          case "${{ matrix.scenario }}" in
            no-tags)
              ;;
            nothing-since-tag)
              git tag v1.0.0
              ;;
            unreleased-changes)
              git tag v1.0.0
              echo "2" > src/foo.c
              git commit -q -am "Change source"
              ;;
            resumed-work)
              git tag v1.0.0
              echo "2" > src/foo.c
              export GIT_AUTHOR_DATE="$(date -u -d '20 days ago' +%Y-%m-%dT%H:%M:%SZ)"
              export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
              git commit -q -am "Start reworking"

              echo "3" > src/foo.c
              export GIT_AUTHOR_DATE="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)"
              export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
              git commit -q -am "Continue reworking"
              unset GIT_AUTHOR_DATE GIT_COMMITTER_DATE
              ;;
            old-unreleased-changes)
              git tag v1.0.0
              echo "2" > src/foo.c
              export GIT_AUTHOR_DATE="$(date -u -d '10 days ago' +%Y-%m-%dT%H:%M:%SZ)"
              export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
              git commit -q -am "Change source"
              unset GIT_AUTHOR_DATE GIT_COMMITTER_DATE

              echo "on: push" > .github/workflows/CI.yml
              git add .github
              git commit -q -m "Change CI"
              ;;
            ignored-changes-only)
              git tag v1.0.0
              echo "on: push" > .github/workflows/CI.yml
              git add .github
              git commit -q -m "Change CI"
              ;;
          esac

      - id: check
        uses: ./this-action/
        with:
          open-issue: 'false'

      - name: "Verify outputs"
        run: |
          if [[ "${{ steps.check.outputs.pending }}" != "${{ matrix.expected }}" ]]; then
            echo "::error::Expected pending=${{ matrix.expected }}, got '${{ steps.check.outputs.pending }}'"
            exit 1
          fi
          if [[ "${{ steps.check.outputs.quiet-days }}" != "${{ matrix.expected-quiet }}" ]]; then
            echo "::error::Expected quiet-days=${{ matrix.expected-quiet }}, got '${{ steps.check.outputs.quiet-days }}'"
            exit 1
          fi
          if [[ "${{ steps.check.outputs.commits }}" != "${{ matrix.expected-commits }}" ]]; then
            echo "::error::Expected commits=${{ matrix.expected-commits }}, got '${{ steps.check.outputs.commits }}'"
            exit 1
          fi
