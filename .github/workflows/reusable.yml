---
name: "Check for pending release"

# Reusable workflow wrapping the action, for packages that would rather not
# maintain the checkout and permission boilerplate themselves: their whole
# workflow is then a `uses:` line, and changes here reach them without a commit
# in their repository. Packages that prefer to see what runs can call the
# action directly instead; see the README.

on:
  workflow_call:
    inputs:
      ignore:
        description: "Newline- or comma-separated list of path prefixes whose changes do not warrant a release"
        type: string
        required: false
        default: |
          .github
          .gitignore
      min-quiet-days:
        description: "Only report a pending release once its most recent change is this many days old"
        type: number
        required: false
        default: 7
      issue-title:
        description: "Title of the tracking issue"
        type: string
        required: false
        default: "Pending release"
      issue-label:
        description: "Label used to find the tracking issue again; created if missing"
        type: string
        required: false
        default: "pending release"
      max-files:
        description: "Maximum number of changed files to list in the issue"
        type: number
        required: false
        default: 50

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          # the check needs the full history and all tags
          fetch-depth: 0

      - uses: gap-actions/check-pending-release@v1
        with:
          ignore: ${{ inputs.ignore }}
          min-quiet-days: ${{ inputs.min-quiet-days }}
          issue-title: ${{ inputs.issue-title }}
          issue-label: ${{ inputs.issue-label }}
          max-files: ${{ inputs.max-files }}
