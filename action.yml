---
name: "Check for a pending GAP package release"
description: "Reports commits that are not part of any release yet by opening a tracking issue"
inputs:
  ignore:
    description: "Newline- or comma-separated list of path prefixes whose changes do not warrant a release"
    required: false
    default: |
      .github
      .gitignore
  min-quiet-days:
    description: "Only report a pending release once its most recent change is this many days old"
    required: false
    default: "7"
  open-issue:
    description: "Set to false to only compute the outputs, without touching any issue"
    required: false
    default: "true"
  issue-title:
    description: "Title of the tracking issue"
    required: false
    default: "Pending release"
  issue-label:
    description: "Label used to find the tracking issue again; created if missing"
    required: false
    default: "pending release"
  max-files:
    description: "Maximum number of changed files to list in the issue"
    required: false
    default: "50"
outputs:
  pending:
    description: "'true' if there are unreleased changes, 'false' otherwise"
    value: ${{ steps.check.outputs.pending }}
  since-tag:
    description: "The most recent tag the check compared against, empty if the repository has no tags"
    value: ${{ steps.check.outputs.since-tag }}
  files:
    description: "Newline-separated list of files changed since that tag, ignored paths removed"
    value: ${{ steps.check.outputs.files }}
  commits:
    description: "Number of commits since that tag which changed non-ignored files, 0 if there is no pending release"
    value: ${{ steps.check.outputs.commits }}
  age-days:
    description: "Age of that tag in days, 0 if the repository has no tags"
    value: ${{ steps.check.outputs.age-days }}
  quiet-days:
    description: "Days since the most recent unreleased change, 0 if there is no pending release"
    value: ${{ steps.check.outputs.quiet-days }}
  tag-time:
    description: "Time that tag was created in seconds since the epoch, empty if the repository has no tags"
    value: ${{ steps.check.outputs.tag-time }}
  last-change-time:
    description: "Time of the most recent unreleased change in seconds since the epoch, empty if there is no pending release"
    value: ${{ steps.check.outputs.last-change-time }}

runs:
  using: "composite"
  steps:
    - name: "Check for unreleased changes"
      id: check
      shell: bash
      run: python3 $GITHUB_ACTION_PATH/scripts/check_pending_release.py "${{ inputs.ignore }}"

    # Anything but an explicit 'false' reports, so that a typo cannot silently
    # turn the check into a no-op.
    - name: "Open, update or close the tracking issue"
      if: ${{ inputs.open-issue != 'false' }}
      uses: actions/github-script@v9
      env:
        PENDING: ${{ steps.check.outputs.pending }}
        QUIET_DAYS: ${{ steps.check.outputs.quiet-days }}
        MIN_QUIET_DAYS: ${{ inputs.min-quiet-days }}
        TAG_TIME: ${{ steps.check.outputs.tag-time }}
        LAST_CHANGE_TIME: ${{ steps.check.outputs.last-change-time }}
        SINCE_TAG: ${{ steps.check.outputs.since-tag }}
        COMMITS: ${{ steps.check.outputs.commits }}
        AGE_DAYS: ${{ steps.check.outputs.age-days }}
        FILES: ${{ steps.check.outputs.files }}
        ISSUE_TITLE: ${{ inputs.issue-title }}
        ISSUE_LABEL: ${{ inputs.issue-label }}
        MAX_FILES: ${{ inputs.max-files }}
      with:
        script: |
          const { report } = require('${{ github.action_path }}/scripts/report.js');
          await report({ github, context, core });
